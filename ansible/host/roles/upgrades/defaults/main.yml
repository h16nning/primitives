---
# Unattended security upgrades for Debian hosts, hypervisor and guests alike
# (the host lifecycle note of the compendium). Debian's own 50unattended-upgrades stays in place; the role adds
# a drop-in on top of it, so the Debian and Debian-Security origins remain and
# only Debian's stable-updates is added. The roles that add a repository of
# their own (docker, netbird) hand in its origin as a
# fragment next to this role's file; Proxmox's repos stay supervised.
#
# Further origins to upgrade unattended, in apt's Origins-Pattern syntax:
#   upgrades_extra_origins:
#     - "origin=Proxmox"
upgrades_extra_origins: []

# Reboot by itself when an upgrade asks for it (kernel, libc). Off for a
# hypervisor: its reboot takes every guest down, so that stays a supervised act.
upgrades_automatic_reboot: false
upgrades_automatic_reboot_time: "04:00"

# When the nightly runs happen (systemd OnCalendar), both randomized a little.
upgrades_update_time: "01:00"
upgrades_upgrade_time: "02:00"

# Restart services that run on outdated libraries after an upgrade, without
# asking. Kernel hints are off: a kernel update is the reboot window's business.
upgrades_needrestart: true
