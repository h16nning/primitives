---
# The host's FQDN; the short name is its first label. The name is mapped to
# the host's own address in /etc/hosts, which a hypervisor such as Proxmox
# requires.
hostname_fqdn: "{{ ansible_facts.fqdn }}"
hostname_ipv4: "{{ ansible_facts.default_ipv4.address | default('') }}"
hostname_ipv6: "{{ ansible_facts.default_ipv6.address | default('') }}"

# Opt-in: the shipped playbooks run this role only where it is true, so a
# provider-named host keeps the name its image gave it.
hostname_enabled: false
