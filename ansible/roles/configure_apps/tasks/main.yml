---
# The app name is the join key across repos (§ 3 PLX-Platform): the inventory record,
# the compose project <tenant>-<slug>, and the host dir all key on it, so it is
# unique per tenant and environment — across every app repo and this platform
# repo. A record's `environment` is `production` when absent; the deployment's
# slug on the host is the name in production and <name>-<environment> elsewhere,
# so a production record changes nothing.
- name: Assert app names are unique per tenant and environment
  ansible.builtin.assert:
    that:
      - >-
        plexus_apps | map(attribute='name') | zip(plexus_apps | map(attribute='environment', default='production'))
        | map('join', '@') | list | unique | length == plexus_apps | length
    fail_msg: "Duplicate app in plexus_apps — one record per app and environment (§ 3 PLX-Platform)."

- name: Configure and start each app
  ansible.builtin.include_tasks: app.yml
  loop: "{{ plexus_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
