---
# The runner host of the hybrid strategy (§ 8 PLX-Delivery): container slots
# for the forge-side jobs (plan, check, publish, deploy, cleanup), each slot a
# systemd unit that runs one job in a fresh container of the runner image and
# is started again by systemd when the job ends; the large jobs (build, test)
# stay on the instances `plan` launches. A slot is registered just in time:
# its unit mints a single-use runner config with the tenant's GitHub App
# before each container, so nothing registered outlives a job and no
# registration token is ever stored.
#
# A slot has no Docker socket: the forge-side jobs need none, and a socket
# would be root on this host. The containers run with the host's network, so
# a slot reaches the registry pair on localhost and the overlay's names the
# host resolves, and holds the job's secrets in flight like any runner: one
# host serves one tenant and runs nothing else (§ 1 PLX-Tenancy).
#
# The host needs Docker before this role (install_docker). The role opens no
# port: the runner polls the forge, and the registry pair listens on loopback.
# Mount it in the playbook of the cadence the host is on, after install_docker
# and before configure_firewall.

# Where the slots register: `repo` registers them on one repository (they
# are then that repository's alone, whatever runner groups the organisation
# has), `org` at the organisation, in a runner group of it.
ci_hybrid_host_scope: repo
# The repository, owner/name, for scope `repo`.
ci_hybrid_host_repo: ""
# The organisation, for scope `org`; the repository's owner by default.
ci_hybrid_host_org: "{{ ci_hybrid_host_repo.split('/')[0] }}"
# The runner group, by name, for scope `org`. A group other than Default is
# a GitHub Team feature; on GitHub Free every private repo of the
# organisation can use what registers here.
ci_hybrid_host_runner_group: Default

# The slots, by size: `small: 4` is the units ci-runner@small-1 to
# ci-runner@small-4, each registering with the label ci-small (§ 8
# PLX-Delivery: plan, publish, deploy and cleanup are small, check is
# medium). A size set to 0, or dropped, stops and disables its units.
ci_hybrid_host_slots:
  small: 4
  medium: 1
# Labels every slot carries besides its size.
ci_hybrid_host_extra_labels: []

# The runner image, built upstream in plexus-ms/primitives (docker/ci-runner)
# with provenance. The tag is the train's to write, never the update bot's;
# a host trying an unreleased image overrides it with `…:sha-<commit>` from a
# manual run of runner-image.yml. A new pin reaches each slot when its
# current container ends; `systemctl restart ci-runner@<slot>` takes it at
# once, cutting off a job the slot is running.
ci_hybrid_host_image: ghcr.io/plexus-ms/ci-runner:0.109.0

# The tenant's GitHub App, which mints the just-in-time configs: its client
# id and private key, from the CI vault through secrets.env (the vault
# `<tenant>-ci`, item github-app). It needs "Administration: write" on the
# repository for scope `repo`, "Self-hosted runners: write" on the
# organisation for scope `org`. Written root-only to the host; once there,
# a run without them keeps what the host has.
ci_hybrid_host_app_client_id: "{{ lookup('env', 'CI_APP_CLIENT_ID') | default('', true) }}"
ci_hybrid_host_app_private_key: "{{ lookup('env', 'CI_APP_PRIVATE_KEY') | default('', true) }}"

# The registry pair (`ci_registry: own`): the CNCF distribution registry on
# 127.0.0.1:5000 against this month's bucket, read-write, and on :5001
# against the previous month's, read-only, as the cloud strategy's jobs start
# them for themselves (`plx-ci registry`, which finds them answering here and
# starts nothing). The buckets are `<owner>-ci-registry-<YYYY-MM>`; the
# housekeeping creates this month's when it is missing and moves the pair to
# the new buckets at the month change. Set false for a tenant on GHCR alone.
ci_hybrid_host_registry: true
ci_hybrid_host_registry_owner: "{{ ci_hybrid_host_org }}"
ci_hybrid_host_registry_image: registry:2
# The storage key of the CI vault (item bucket-registry), read and write on
# the buckets plus creating them; root-only on the host, kept like the App's.
ci_hybrid_host_registry_endpoint: "{{ lookup('env', 'REGISTRY_ENDPOINT') | default('', true) }}"
ci_hybrid_host_registry_region: "{{ lookup('env', 'REGISTRY_REGION') | default('', true) }}"
ci_hybrid_host_registry_access_key: "{{ lookup('env', 'REGISTRY_ACCESS_KEY') | default('', true) }}"
ci_hybrid_host_registry_secret_key: "{{ lookup('env', 'REGISTRY_SECRET_KEY') | default('', true) }}"

# The caches shared by every slot, bind-mounted into each container: the
# pnpm store, built for concurrent writers (content-addressed, files added
# by atomic rename). Owned by the image's runner user.
ci_hybrid_host_cache_dir: /var/cache/ci-runner
ci_hybrid_host_runner_uid: 1001

# Housekeeping, hourly: the registry pair onto this month's buckets, the
# pinned image pulled, stopped containers and unused images removed; fails,
# and so mails through configure_mail, when the root file system is fuller
# than this afterwards.
ci_hybrid_host_disk_alert_percent: 85
