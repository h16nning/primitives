---
- name: Read the existing guests
  ansible.builtin.command:
    cmd: pvesh get /nodes/{{ ansible_facts.hostname }}/qemu --output-format json
  register: guests_existing
  changed_when: false
  check_mode: false

- name: Create the missing guests
  when: guests_missing | length > 0
  vars:
    guests_missing: >-
      {{ guests_list
         | rejectattr('vmid', 'in', guests_existing.stdout | from_json | map(attribute='vmid') | list)
         | list }}
    guests_image: "{{ guests_image_dir }}/{{ guests_image_url | basename }}"
    guests_ssh_keys: /run/guests.keys
  block:
    - name: Fail when there is no admin to log in to a new guest
      ansible.builtin.assert:
        that:
          - guests_admin.name is defined
          - guests_admin.ssh_keys | default([]) | length > 0
        fail_msg: >-
          A new guest would have no account to log in to; set iam_admins
          or guests_admin (name, ssh_keys).
        quiet: true

    - name: Create the image directory
      ansible.builtin.file:
        path: "{{ guests_image_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the cloud image
      ansible.builtin.get_url:
        url: "{{ guests_image_url }}"
        dest: "{{ guests_image }}"
        checksum: "{{ guests_image_checksum }}"
        owner: root
        group: root
        mode: "0644"
      when: not ansible_check_mode # the module would fetch the whole image to compare it

    # qm reads the keys from a file; it is only the hand-over, on tmpfs.
    - name: Hand the admin's SSH keys over
      ansible.builtin.copy:
        dest: "{{ guests_ssh_keys }}"
        owner: root
        group: root
        mode: "0600"
        content: "{{ guests_admin.ssh_keys | join('\n') }}\n"
      changed_when: false

    - name: Create each missing guest
      ansible.builtin.include_tasks: create.yml
      loop: "{{ guests_missing }}"
      loop_control:
        label: "{{ item.name }} ({{ item.vmid }})"

    - name: Remove the handed-over keys
      ansible.builtin.file:
        path: "{{ guests_ssh_keys }}"
        state: absent
      changed_when: false
