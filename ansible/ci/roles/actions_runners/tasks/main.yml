---
- name: Require where the slots register
  ansible.builtin.assert:
    that:
      - actions_runners_scope in ['repo', 'org']
      - actions_runners_scope != 'repo' or actions_runners_repo is match('^[^/]+/[^/]+$')
      - actions_runners_scope != 'org' or actions_runners_org | length > 0
    fail_msg: >-
      actions_runners_scope is `repo` with actions_runners_repo as owner/name,
      or `org` with actions_runners_org (and actions_runners_runner_group).

- name: Require the slots by size
  ansible.builtin.assert:
    that:
      - actions_runners_slots.keys() | difference(['small', 'medium', 'large']) | length == 0
      - actions_runners_slots.values() | select('mapping') | list | length == actions_runners_slots | length
    fail_msg: >-
      actions_runners_slots maps the sizes small, medium and large to
      `{ count: <n>, memory: <limit> }`, e.g. `small: { count: 4, memory: 2g }`.

- name: Name the slots and their units
  ansible.builtin.set_fact:
    actions_runners_slot_names: "{{ names }}"
    actions_runners_slot_units: "{{ names | map('regex_replace', '^', 'ci-runner@') | map('regex_replace', '$', '.service') | list }}"
  vars:
    names: >-
      {%- set names = [] -%}
      {%- for size, slot in actions_runners_slots.items() -%}
      {%- for n in range(1, (slot.count | default(0) | int) + 1) -%}
      {%- set _ = names.append(size ~ '-' ~ n) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ names }}

- name: Install what the scripts need
  ansible.builtin.apt:
    name: [curl, jq, openssl]
    state: present

- name: Create the configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: [/etc/ci-runner, /etc/ci-registry]

# The App's credentials: written when the run has them, kept when it does
# not, required once.
- name: Write the App's credentials
  when: actions_runners_app_client_id | length > 0 and actions_runners_app_private_key | length > 0
  no_log: true
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - dest: /etc/ci-runner/app.env
      content: "APP_CLIENT_ID={{ actions_runners_app_client_id }}\n"
    # A key pasted into a one-line vault field arrives with spaces for its
    # line breaks; its lines are restored.
    - dest: /etc/ci-runner/app.pem
      content: |
        {% set key = actions_runners_app_private_key | trim %}
        {% if '\n' in key %}
        {{ key }}
        {% else %}
        {% set parts = key | regex_search('^(-----BEGIN [A-Z0-9 ]+-----) (.*) (-----END [A-Z0-9 ]+-----)$', '\\1', '\\2', '\\3') %}
        {{ parts[0] }}
        {{ parts[1] | regex_replace(' ', '\n') }}
        {{ parts[2] }}
        {% endif %}

- name: Check the App's credentials are on the host
  ansible.builtin.stat:
    path: /etc/ci-runner/app.pem
  register: actions_runners_app_pem

- name: Require the App's credentials
  ansible.builtin.assert:
    that: actions_runners_app_pem.stat.exists or ansible_check_mode
    fail_msg: >-
      The host has no App credentials and the run brought none:
      CI_APP_CLIENT_ID and CI_APP_PRIVATE_KEY, from the CI vault's item
      github-app through secrets.env.

- name: Write where the slots register
  ansible.builtin.copy:
    dest: /etc/ci-runner/runner.env
    owner: root
    group: root
    mode: "0600"
    content: |
      SCOPE={{ actions_runners_scope }}
      REPO={{ actions_runners_repo }}
      ORG={{ actions_runners_org }}
      GROUP='{{ actions_runners_runner_group }}'
      HOST={{ inventory_hostname }}
      EXTRA_LABELS={{ actions_runners_extra_labels | join(',') }}
  notify: Restart the slots

- name: Install the scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /usr/local/sbin/{{ item }}
    owner: root
    group: root
    mode: "0755"
  loop: [ci-runner-jit, ci-runner-slot, ci-registry-refresh, ci-connect-refresh, ci-runner-housekeeping]

- name: Create the shared caches
  ansible.builtin.file:
    path: "{{ actions_runners_cache_dir }}/{{ item }}"
    state: directory
    owner: "{{ actions_runners_runner_uid }}"
    group: "{{ actions_runners_runner_uid }}"
    mode: "0755"
  loop: ["", pnpm-store]

- name: Pull the runner image
  when: not actions_runners_image_build
  ansible.builtin.command:
    cmd: docker pull {{ actions_runners_image }}
  register: actions_runners_pull
  changed_when: "'Downloaded newer image' in actions_runners_pull.stdout"
  notify: Restart the slots

- name: Build the runner image on the host
  when: actions_runners_image_build
  block:
    - name: Copy the image's build context
      ansible.builtin.copy:
        src: ci-runner/
        dest: /usr/local/share/ci-runner/
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"

    - name: Which image the tag names now
      ansible.builtin.command:
        cmd: docker image inspect --format '{{ '{{' }}.Id{{ '}}' }}' {{ actions_runners_image }}
      register: actions_runners_image_before
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Build it
      ansible.builtin.command:
        cmd: docker build --pull --quiet --tag {{ actions_runners_image }} /usr/local/share/ci-runner
      register: actions_runners_build
      changed_when: actions_runners_build.stdout | trim != actions_runners_image_before.stdout | trim
      notify: Restart the slots

- name: The registry pair
  when: actions_runners_registry
  ansible.builtin.include_tasks: registry.yml

- name: The Connect server
  when: actions_runners_connect
  ansible.builtin.include_tasks: connect.yml

- name: No Connect server
  when: not actions_runners_connect
  block:
    # Without Connect the slots read with the workflow's service account token.
    - name: Remove the slots' Connect token
      ansible.builtin.file:
        path: /etc/ci-runner/connect.env
        state: absent
      notify: Restart the slots

    - name: Stop the Connect server
      ansible.builtin.command:
        cmd: docker rm --force op-connect-api op-connect-sync
      register: actions_runners_connect_removed
      changed_when: actions_runners_connect_removed.stdout | length > 0
      failed_when: false

# What a slot's container is made of: the image and the cache for every
# slot, the memory limit per size. ci-runner-slot reads both at the start of
# a container, and the JIT script reads where to register, so a change to any
# of them restarts the slots (the handler): a job in flight on this host
# fails and is run again by hand, which a configure run on a runner host
# accepts, since an idle slot would otherwise keep its old configuration
# until a job happens to land on it.
- name: Write what every slot runs
  ansible.builtin.copy:
    dest: /etc/ci-runner/slot.env
    owner: root
    group: root
    mode: "0600"
    content: |
      IMAGE={{ actions_runners_image }}
      CACHE_DIR={{ actions_runners_cache_dir }}
  notify: Restart the slots

- name: Write each size's limit
  ansible.builtin.copy:
    dest: /etc/ci-runner/size-{{ item.key }}.env
    owner: root
    group: root
    mode: "0600"
    content: |
      MEMORY={{ item.value.memory | default('', true) }}
  loop: "{{ actions_runners_slots | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart the slots

# One template unit, one instance per slot. ExecStartPre frees the name and
# mints the slot's config; the container runs one job and exits, and
# systemd starts the next one.
- name: Install the slot unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/ci-runner@.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=CI runner slot {{ inventory_hostname }}-%i
      After=network-online.target docker.service
      Wants=network-online.target
      Requires=docker.service
      StartLimitIntervalSec=0

      [Service]
      ExecStartPre=-/usr/bin/docker rm --force --volumes ci-runner-%i
      ExecStartPre=/usr/local/sbin/ci-runner-jit %i
      ExecStart=/usr/local/sbin/ci-runner-slot %i
      ExecStopPost=-/usr/bin/docker rm --force --volumes ci-runner-%i
      ExecStopPost=-/usr/bin/rm -f /run/ci-runner/%i.env
      TimeoutStartSec=5min
      TimeoutStopSec=1min
      Restart=always
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
  notify: [Reload systemd, Restart the slots]

- name: Install the housekeeping service
  ansible.builtin.copy:
    dest: /etc/systemd/system/ci-runner-housekeeping.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=CI runner host housekeeping
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      Environment=IMAGE={{ actions_runners_image }}
      Environment=PULL={{ (not actions_runners_image_build) | lower }}
      Environment=REGISTRY={{ actions_runners_registry | bool | lower }}
      Environment=REGISTRY_IMAGE={{ actions_runners_registry_image }}
      Environment=DISK_ALERT_PERCENT={{ actions_runners_disk_alert_percent }}
      ExecStart=/usr/local/sbin/ci-runner-housekeeping
  notify: Reload systemd

- name: Install the housekeeping timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/ci-runner-housekeeping.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=CI runner host housekeeping

      [Timer]
      OnCalendar=hourly
      RandomizedDelaySec=5m
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable the housekeeping timer
  ansible.builtin.systemd_service:
    name: ci-runner-housekeeping.timer
    enabled: true
    state: started

- name: Enable and start the slots
  ansible.builtin.systemd_service:
    name: ci-runner@{{ item }}.service
    enabled: true
    state: started
  loop: "{{ actions_runners_slot_names }}"

- name: Find the slots that are no longer configured
  ansible.builtin.service_facts:

- name: Stop and disable them
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: >-
    {{ ansible_facts.services | dict2items | map(attribute='key')
       | select('match', '^ci-runner@.+[.]service$') | difference(actions_runners_slot_units) }}
