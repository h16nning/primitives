---
# The registry pair's storage key, root-only, as the env file the two
# containers read; written when the run has the key, kept when it does not.
- name: Write the registry's storage key
  when: actions_runners_registry_access_key | length > 0 and actions_runners_registry_secret_key | length > 0
  no_log: true
  ansible.builtin.copy:
    dest: /etc/ci-registry/registry.env
    owner: root
    group: root
    mode: "0600"
    content: |
      REGISTRY_STORAGE=s3
      REGISTRY_STORAGE_S3_REGIONENDPOINT={{ actions_runners_registry_endpoint }}
      REGISTRY_STORAGE_S3_REGION={{ actions_runners_registry_region }}
      REGISTRY_STORAGE_S3_ACCESSKEY={{ actions_runners_registry_access_key }}
      REGISTRY_STORAGE_S3_SECRETKEY={{ actions_runners_registry_secret_key }}
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE=true
  register: actions_runners_registry_key

- name: Check the storage key is on the host
  ansible.builtin.stat:
    path: /etc/ci-registry/registry.env
  register: actions_runners_registry_env

- name: Require the storage key
  ansible.builtin.assert:
    that: actions_runners_registry_env.stat.exists or ansible_check_mode
    fail_msg: >-
      The host has no storage key for the registry pair and the run brought
      none: REGISTRY_ENDPOINT, REGISTRY_REGION, REGISTRY_ACCESS_KEY and
      REGISTRY_SECRET_KEY, from the CI vault's item bucket-registry through
      secrets.env; or actions_runners_registry false.

- name: Write the pair's owner and image
  ansible.builtin.copy:
    dest: /etc/ci-registry/pair.env
    owner: root
    group: root
    mode: "0644"
    content: |
      OWNER={{ actions_runners_registry_owner }}
      IMAGE={{ actions_runners_registry_image }}

# A new key reaches running containers only when they are created anew; the
# refresh otherwise leaves a container on the right bucket and image alone.
- name: Start the pair on this month's buckets
  ansible.builtin.command:
    cmd: /usr/local/sbin/ci-registry-refresh
  environment:
    RECREATE: "{{ actions_runners_registry_key is changed }}"
  register: actions_runners_refresh
  changed_when: actions_runners_refresh.stdout | length > 0
