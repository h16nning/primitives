# Lists every role of the four collections so `mise :check` can syntax-check
# them all; tests/all-roles-listed.sh fails when a role is missing here. Never run.
- name: Every role of the collections
  hosts: all
  roles:
    - plexus.ci.actions_runners
    - plexus.host.alloy
    - plexus.host.base
    - plexus.host.docker
    - plexus.host.firewall
    - plexus.host.hostname
    - plexus.host.iam
    - plexus.host.mail
    - plexus.host.netbird
    - plexus.host.sshd
    - plexus.host.upgrades
    - plexus.infrastructure.guest_agent
    - plexus.infrastructure.guests
    - plexus.infrastructure.haproxy
    - plexus.infrastructure.pbs
    - plexus.infrastructure.proxmox
    - plexus.platform.apps
    - plexus.platform.caddy
    - plexus.platform.deploy_user
    - plexus.platform.ingress
    - plexus.platform.secrets
